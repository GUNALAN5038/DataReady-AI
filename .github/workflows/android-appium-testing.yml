name: Android Appium E2E Testing

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feat/*]
    paths:
      - 'mobile/**'
      - 'DataReady_AI_Appium/**'

jobs:
  appium-android-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium & Dependencies
        working-directory: DataReady_AI_Appium
        run: |
          npm install
          npm install -g appium
          appium driver install uiautomator2

      - name: Upload Android Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-appium-reports
          path: |
            DataReady_AI_Appium/reports/excel/
            DataReady_AI_Appium/reports/html/
            DataReady_AI_Appium/reports/screenshots/
            reports/final-testing/DataReadyAI_Android_E2E_Report.xlsx
            reports/final-testing/android-e2e.html
            reports/final-testing/screenshots/android/

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "### 📱 Android Appium Automation Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** com.datareadyai.mobile" >> $GITHUB_STEP_SUMMARY
          echo "- **Engine:** Appium + UiAutomator2" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts Uploaded:** Excel report, HTML report, screenshots" >> $GITHUB_STEP_SUMMARY
