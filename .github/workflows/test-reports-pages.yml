name: Publish Test Reports to GitHub Pages

on:
  workflow_dispatch: # Manual trigger only — requires explicit user action

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy-reports:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify Sanitization of Reports
        run: |
          echo "Verifying reports directory does not contain private secrets..."
          grep -rn "AIzaSy" reports/ && exit 1 || echo "No API keys found."
          grep -rn "service_role" reports/ && exit 1 || echo "No service keys found."

      - name: Upload Reports Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'reports/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
